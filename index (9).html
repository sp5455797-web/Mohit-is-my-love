<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Gift</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
}

.container{
text-align:center;
z-index:10;
padding:20px;
}

#btn{
padding:16px 40px;
font-size:28px;
border:none;
border-radius:50px;
background:#ff4da6;
color:white;
cursor:pointer;
box-shadow:0 0 25px hotpink;
transition:.3s;
}

#btn:hover{
transform:scale(1.08);
}

#text{
display:none;
color:pink;
font-size:36px;
font-weight:bold;
text-shadow:0 0 20px hotpink;
min-height:120px;
animation:show 1s;
}

#final{
display:none;
color:pink;
font-size:45px;
font-weight:bold;
text-shadow:0 0 25px hotpink;
animation:show 2s;
}

.glow{
font-size:100px;
animation:glow 1s infinite alternate;
}

@keyframes glow{
from{
transform:scale(1);
text-shadow:0 0 15px pink,0 0 35px hotpink;
}
to{
transform:scale(1.2);
text-shadow:0 0 35px pink,0 0 70px hotpink;
}
}

@keyframes show{
from{
opacity:0;
transform:translateY(25px) scale(.9);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.heart{
position:fixed;
top:-40px;
animation:fall linear forwards;
pointer-events:none;
}

@keyframes fall{
0%{
transform:translateY(-40px);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}

iframe{
width:0;
height:0;
border:0;
opacity:0;
position:absolute;
}
</style>
</head>
<body>

<!-- Hidden Music -->
<iframe id="music"
allow="autoplay"
src="">
</iframe>

<div class="container">

<button id="btn">Continue 💝</button>

<div id="text"></div>

<div id="final">
I love you Mohit ji 💝
<br><br>
<div class="glow">😍</div>
</div>

</div>

<script>

const lines=[
"Love is beautiful ✨",
"Love is life 💖",
"Love is strong 💕",
"Love is smart 🌸",
"But you 💗",
"You are 🌹",
"My love 💝",
"And small gift 🎁",
"For you 💓",
"🫂 1 hug for you and"
];

const btn=document.getElementById("btn");
const text=document.getElementById("text");
const final=document.getElementById("final");
const music=document.getElementById("music");

btn.onclick=function(){

// Music start SAME TIME
music.src="https://www.youtube.com/embed/rHYsI-seMVM?autoplay=1&mute=0&loop=1&playlist=rHYsI-seMVM&controls=0";

// Hide button
btn.style.display="none";
text.style.display="block";

let i=0;

function nextLine(){

if(i<lines.length){

text.style.animation="none";
void text.offsetWidth;
text.style.animation="show .9s";

text.innerHTML=lines[i];
i++;

setTimeout(nextLine,2000); // 2 sec each

}else{
text.style.display="none";
final.style.display="block";
}
}

nextLine();
};

// Falling Hearts
function makeHeart(){
const h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*35)+"px";
h.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},8000);
}

setInterval(makeHeart,150);

</script>
</body>
</html>
